name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Publicar a release precisa de permissão de escrita no repositório.
permissions:
  contents: write

jobs:
  server:
    name: Servidor (Rust) + testes de contrato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test -w @line/server
      - run: npm run typecheck

  windows:
    name: App Windows (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Versão do build e assinatura do atualizador
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          # Assinatura de código (tira o aviso do SmartScreen). Só liga quando os secrets do
          # Azure Trusted Signing existirem; sem eles o instalador sai sem assinatura, como antes.
          HAS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
          SIGN_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGN_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          sign=""
          if [ "$HAS_SIGNING" = "true" ]; then
            cargo install trusted-signing-cli --locked
            sign=",\"windows\":{\"signCommand\":\"trusted-signing-cli -e $SIGN_ENDPOINT -a $SIGN_ACCOUNT -c $SIGN_PROFILE -d Line %1\"}"
          fi
          echo "{\"version\":\"0.1.${{ github.run_number }}\",\"bundle\":{\"createUpdaterArtifacts\":$HAS_KEY$sign}}" > apps/desktop/src-tauri/ci.conf.json
          cat apps/desktop/src-tauri/ci.conf.json
      - run: npm run dist:win -w @line/desktop -- --config src-tauri/ci.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      - name: Pacote MSIX da Microsoft Store
        shell: pwsh
        env:
          # Dados da Partner Center (Produto > Identidade do produto), em Settings > Variables.
          # Os padrões abaixo são os do produto "Line: Chat e Voz" (ID 9NJ9ZQ9T92QR); as variáveis só servem para trocar.
          IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME || 'AlexandreSouza.LineChateVoz' }}
          PUBLISHER: ${{ vars.MSSTORE_PUBLISHER || 'CN=0B1640DA-C2DE-40D6-9091-7568BF2908F8' }}
          PUBLISHER_NAME: ${{ vars.MSSTORE_PUBLISHER_NAME || 'Alexandre Souza' }}
          DISPLAY_NAME: "${{ vars.MSSTORE_DISPLAY_NAME || 'Line: Chat e Voz' }}"
        run: >
          apps/desktop/scripts/make-msix.ps1 -Version "0.1.${{ github.run_number }}"
          -IdentityName $env:IDENTITY_NAME -Publisher $env:PUBLISHER -PublisherName $env:PUBLISHER_NAME -DisplayName $env:DISPLAY_NAME
      - uses: actions/upload-artifact@v4
        with:
          name: Line-microsoft-store
          path: target/release/bundle/msix/*.msix
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Line-instalador-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  linux:
    name: App Linux (Tauri) .deb, .rpm e AppImage
    # 22.04 (glibc 2.35): o .deb roda no Debian 12 e Ubuntu 22.04+, o .rpm no Fedora, e o AppImage
    # (com WebKitGTK e GStreamer dentro) em qualquer distro. As chamadas usam o motor WebRTC em
    # Rust (crates/line-rtc), porque o WebKitGTK das distros vem sem RTCPeerConnection.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do Tauri e do GStreamer (vai dentro do AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev patchelf \
            libayatana-appindicator3-dev cmake libfuse2 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio gstreamer1.0-pipewire
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Motor WebRTC (chamada de verdade entre duas instâncias, áudio e vídeo)
        run: cargo test -p line-rtc
      - name: Versão do build e assinatura do atualizador
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: echo "{\"version\":\"0.1.${{ github.run_number }}\",\"bundle\":{\"createUpdaterArtifacts\":$HAS_KEY}}" > apps/desktop/src-tauri/ci.conf.json
      - run: npm run dist:linux -w @line/desktop -- --config src-tauri/ci.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: Line-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/deb/*.deb.sig
            target/release/bundle/rpm/*.rpm
            target/release/bundle/rpm/*.rpm.sig
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
      # A interface web (useline.tech/app) é o mesmo build que vai dentro do app desktop.
      - uses: actions/upload-artifact@v4
        with:
          name: Line-web
          path: apps/desktop/out
          if-no-files-found: error

  macos:
    name: App macOS (Tauri, universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Versão do build e assinatura do atualizador
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: echo "{\"version\":\"0.1.${{ github.run_number }}\",\"bundle\":{\"createUpdaterArtifacts\":$HAS_KEY}}" > apps/desktop/src-tauri/ci.conf.json
      # Um app só que roda em Mac com Apple Silicon (M1+) e Intel.
      - run: npm run dist:mac -w @line/desktop -- --config src-tauri/ci.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: Line-macos
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  release:
    name: Publicar download
    # Só na branch principal: cada push vira uma release com os dois instaladores.
    if: github.event_name != 'pull_request'
    needs: [server, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # O artefato do macOS vem com subpastas (dmg/, macos/): junta tudo numa pasta só,
          # porque o gh não sobe diretórios.
          mkdir -p files
          find dist -type f -exec cp {} files/ \;
          ls -la files
          tag="build-${{ github.run_number }}"
          # Se a run for reexecutada, a release desta build já existe: troca os arquivos.
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" files/* --repo "${{ github.repository }}" --clobber
            exit 0
          fi
          gh release create "$tag" files/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Line (build ${{ github.run_number }})" \
            --latest \
            --notes "Instaladores gerados automaticamente a partir de ${{ github.sha }}.

          - **Windows**: baixe o \`.exe\` e execute (instala só para o seu usuário).
          - **Linux**: \`.deb\` (Debian/Ubuntu: \`sudo apt install ./Line_*_amd64.deb\`), \`.rpm\` (Fedora: \`sudo dnf install ./Line-*.rpm\`) ou \`.AppImage\` (qualquer distro: \`chmod +x\` e abrir).
          - **macOS**: baixe o \`.dmg\`, arraste o Line para Aplicativos e, na primeira vez, clique com o botão direito em Abrir (o app ainda não é assinado pela Apple)."

  updates:
    name: Publicar atualização do app (VPS)
    if: github.event_name != 'pull_request'
    needs: [server, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Line-instalador-windows
          path: win
      - uses: actions/download-artifact@v4
        with:
          name: Line-linux
          path: linux
      - uses: actions/download-artifact@v4
        with:
          name: Line-macos
          path: mac
      - uses: actions/download-artifact@v4
        with:
          name: Line-web
          path: web
      - name: Enviar instalador e latest.json para useline.tech/updates
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          HOST: useline.tech
        run: |
          if [ -z "$DEPLOY_KEY" ] || ! ls win/*.exe.sig >/dev/null 2>&1; then
            echo "Sem VPS_DEPLOY_KEY ou sem assinatura: pulando a publicação da atualização."
            exit 0
          fi
          exe=$(ls win/*.exe | grep -v '\.sig$' | head -n1)
          name=$(basename "$exe")
          version="0.1.${{ github.run_number }}"
          jq -n --arg v "$version" --arg sig "$(cat "$exe.sig")" --arg url "https://$HOST/updates/$name" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $v, notes: "Build \($v)", pub_date: $date, platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' > latest.json
          # macOS: o mesmo app universal atende Apple Silicon e Intel.
          # O artefato do macOS guarda os arquivos em subpastas (macos/, dmg/).
          macgz=$(find mac -name '*.app.tar.gz' | head -n1)
          macname="Line_${version}_universal.app.tar.gz"
          if [ -n "$macgz" ] && [ -f "$macgz.sig" ]; then
            jq --arg sig "$(cat "$macgz.sig")" --arg url "https://$HOST/updates/$macname" \
              '.platforms["darwin-aarch64"] = {signature: $sig, url: $url} | .platforms["darwin-x86_64"] = {signature: $sig, url: $url}' \
              latest.json > latest.tmp && mv latest.tmp latest.json
          fi
          # Linux: o atualizador procura linux-x86_64-{deb,rpm,appimage}, conforme o pacote instalado.
          linux_files=()
          for kind in deb rpm AppImage; do
            f=$(find linux -name "*.$kind" | head -n1)
            if [ -n "$f" ] && [ -f "$f.sig" ]; then
              key="linux-x86_64-$(echo "$kind" | tr '[:upper:]' '[:lower:]')"
              jq --arg k "$key" --arg sig "$(cat "$f.sig")" --arg url "https://$HOST/updates/$(basename "$f")" \
                '.platforms[$k] = {signature: $sig, url: $url}' latest.json > latest.tmp && mv latest.tmp latest.json
              linux_files+=("$f")
            fi
          done
          cat latest.json
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Instalador primeiro; o latest.json por último, para nunca apontar para um arquivo que ainda não chegou.
          scp -i ~/.ssh/deploy "$exe" "line-deploy@$HOST:/opt/line/updates/$name"
          if [ -n "$macgz" ] && [ -f "$macgz.sig" ]; then
            scp -i ~/.ssh/deploy "$macgz" "line-deploy@$HOST:/opt/line/updates/$macname"
          else
            echo "Sem atualizador do macOS nesta build: publicando só o Windows."
          fi
          for f in "${linux_files[@]}"; do
            scp -i ~/.ssh/deploy "$f" "line-deploy@$HOST:/opt/line/updates/$(basename "$f")"
          done
          scp -i ~/.ssh/deploy latest.json "line-deploy@$HOST:/opt/line/updates/latest.json.tmp"
          # Várias runs podem terminar fora de ordem: só troca o latest.json se esta versão for
          # a mais nova, e a limpeza nunca apaga o instalador para o qual o latest.json aponta.
          ssh -i ~/.ssh/deploy "line-deploy@$HOST" bash -s -- "$version" "$name" <<'REMOTE'
          set -e
          cd /opt/line/updates
          cur=$(grep -o '"version": *"[^"]*"' latest.json 2>/dev/null | grep -o '[0-9][0-9.]*' || echo 0)
          if [ "$(printf '%s\n' "$cur" "$1" | sort -V | tail -n1)" = "$1" ]; then
            mv latest.json.tmp latest.json
          else
            echo "latest.json já está em $cur (mais nova que $1)."; rm -f latest.json.tmp
          fi
          keep=$(grep -o 'Line_[0-9.]*_x64-setup\.exe' latest.json | head -n1)
          ls -t *.exe | grep -vxF -e "$keep" -e "$2" | tail -n +3 | xargs -r rm --
          ls -t *.app.tar.gz 2>/dev/null | tail -n +4 | xargs -r rm -- || true
          for ext in deb rpm AppImage; do ls -t *.$ext 2>/dev/null | tail -n +4 | xargs -r rm -- || true; done
          REMOTE
          # Se uma run mais nova já publicou, não volta os downloads e o site para esta versão.
          if [ "$(curl -fsS "https://$HOST/updates/latest.json" | jq -r .version)" != "$version" ]; then
            echo "Já existe uma versão mais nova publicada: mantendo downloads e site como estão."
            exit 0
          fi
          # Links fixos usados pela aba Downloads do site (useline.tech/downloads).
          deb=$(find linux -name '*.deb' | head -n1)
          rpm=$(find linux -name '*.rpm' | head -n1)
          appimage=$(find linux -name '*.AppImage' | head -n1)
          ssh -i ~/.ssh/deploy "line-deploy@$HOST" "mkdir -p /opt/line/updates/latest"
          scp -i ~/.ssh/deploy "$exe" "line-deploy@$HOST:/opt/line/updates/latest/Line-windows-setup.exe.tmp"
          dmg=$(find mac -name '*.dmg' | head -n1)
          scp -i ~/.ssh/deploy "$deb" "line-deploy@$HOST:/opt/line/updates/latest/Line-linux.deb.tmp"
          scp -i ~/.ssh/deploy "$rpm" "line-deploy@$HOST:/opt/line/updates/latest/Line-linux.rpm.tmp"
          scp -i ~/.ssh/deploy "$appimage" "line-deploy@$HOST:/opt/line/updates/latest/Line-linux.AppImage.tmp"
          scp -i ~/.ssh/deploy "$dmg" "line-deploy@$HOST:/opt/line/updates/latest/Line-macos.dmg.tmp"
          ssh -i ~/.ssh/deploy "line-deploy@$HOST" "cd /opt/line/updates/latest && mv Line-windows-setup.exe.tmp Line-windows-setup.exe && mv Line-linux.deb.tmp Line-linux.deb && mv Line-linux.rpm.tmp Line-linux.rpm && mv Line-linux.AppImage.tmp Line-linux.AppImage && mv Line-macos.dmg.tmp Line-macos.dmg"
          # Site de apresentação (raiz do useline.tech).
          # Precisa da pasta /opt/line/site criada pelo install.sh; sem ela, só avisa.
          scp -i ~/.ssh/deploy -r apps/site/* "line-deploy@$HOST:/opt/line/site/" \
            || echo "Sem /opt/line/site na VPS: rode o install.sh de novo para ativar o site."
          # Painel administrador (backoffice.useline.tech). Precisa da pasta criada pelo install.sh.
          scp -i ~/.ssh/deploy -r apps/admin/* "line-deploy@$HOST:/opt/line/admin/" \
            || echo "Sem /opt/line/admin na VPS: rode o install.sh de novo para ativar o painel."
          # App web (useline.tech/app): sai junto com o desktop, mesma versão. Os arquivos novos
          # entram por cima; o index.html vai por último para nunca apontar para um arquivo que falta.
          if tar czf - -C web --exclude=./index.html . | ssh -i ~/.ssh/deploy "line-deploy@$HOST" "tar xzf - -C /opt/line/web" \
            && scp -i ~/.ssh/deploy web/index.html "line-deploy@$HOST:/opt/line/web/index.html"; then
            echo "App web atualizado para $version."
          else
            echo "Sem permissão em /opt/line/web: rode o install.sh de novo para o CI publicar a web."
          fi
