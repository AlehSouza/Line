name: CI

on:
  push:
    branches: [main, master, claude/project-thread-dqswre]
  pull_request:
  workflow_dispatch:

# Publicar a release precisa de permissão de escrita no repositório.
permissions:
  contents: write

jobs:
  server:
    name: Servidor (Rust) + testes de contrato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test -w @line/server
      - run: npm run typecheck

  windows:
    name: App Windows (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Line-instalador-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: App Linux .deb (Tauri)
    # 22.04 (glibc 2.35) para o pacote rodar também no Debian 12 e Ubuntu 22.04+.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Line-linux-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    name: Publicar download
    # Só na branch principal: cada push vira uma release com os dois instaladores.
    if: github.event_name != 'pull_request'
    needs: [server, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          tag="build-${{ github.run_number }}"
          gh release create "$tag" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Line (build ${{ github.run_number }})" \
            --latest \
            --notes "Instaladores gerados automaticamente a partir de ${{ github.sha }}.

          - **Windows**: baixe o \`.exe\` e execute (instala só para o seu usuário).
          - **Linux (Debian/Ubuntu)**: baixe o \`.deb\` e rode \`sudo apt install ./Line_*_amd64.deb\`."
