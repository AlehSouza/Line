[package]
name = "line-rtc"
description = "Motor WebRTC do app Linux do Line: RTCPeerConnection em Rust (webrtc-rs) com Opus embutido"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# webrtc-rs e o núcleo sans-IO dele andam juntos: as duas versões precisam ser iguais.
webrtc = "=0.21.1"
rtc = "=0.21.1"
opus = "0.3"
# Compila a libopus junto (cmake), sem depender da versão instalada em cada distro.
audiopus_sys = { version = "0.2", features = ["static"] }
async-trait = "0.1"
bytes = "1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
