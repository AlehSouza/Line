<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Line</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1a1f; color: #f2f2f5;
    font: 500 14px/1.4 system-ui, "Segoe UI", sans-serif; overflow: hidden; user-select: none; cursor: default; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    -webkit-app-region: drag; }
  svg { width: 72px; height: 72px; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(0.93); opacity: 0.85; } }
  #status { min-height: 20px; text-align: center; padding: 0 20px; }
  .bar { width: 180px; height: 6px; border-radius: 99px; background: #2c2c34; overflow: hidden; visibility: hidden; }
  .bar.on { visibility: visible; }
  .fill { height: 100%; width: 0%; border-radius: 99px; background: #7c6af2; transition: width 0.2s; }
  .bar.busy .fill { width: 35%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
</style>
</head>
<body>
  <svg viewBox="0 0 32 32" aria-hidden="true">
    <rect x="1" y="1" width="30" height="30" rx="10" fill="#7c6af2" />
    <path d="M8 19c3-6 6-6 8-3s5 3 8-3" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="24" cy="10" r="2.4" fill="#fff" opacity="0.7" />
  </svg>
  <div id="status">Procurando atualizações...</div>
  <div class="bar busy on" id="bar"><div class="fill" id="fill"></div></div>
  <script>
    // O app (Rust) chama isto para mostrar o andamento. pct: null = barra indeterminada, -1 = sem barra.
    window.lineSplash = function (text, pct) {
      document.getElementById('status').textContent = text;
      var bar = document.getElementById('bar');
      var fill = document.getElementById('fill');
      bar.classList.toggle('on', pct !== -1);
      bar.classList.toggle('busy', pct === null || pct === undefined);
      fill.style.width = typeof pct === 'number' && pct >= 0 ? Math.min(100, pct) + '%' : '';
    };
  </script>
</body>
</html>
