[package]
name = "line-desktop"
description = "Line: app de chat e comunidades (casco Tauri em Rust)"
version.workspace = true
edition.workspace = true

[lib]
name = "line_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


[target.'cfg(target_os = "linux")'.dependencies]
# Ligar WebRTC/microfone no WebKitGTK (vem desligado por padrão).
webkit2gtk = { version = "2.0", features = ["v2_38"] }

[target.'cfg(windows)'.dependencies]
# Seletor próprio de compartilhar tela: lista janelas/telas com miniaturas (xcap)
# e captura a escolhida pelo Windows Graphics Capture (windows-capture).
xcap = "0.9"
windows-capture = "2"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia"] }
windows-core = "0.62"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Seletor próprio de compartilhar tela no macOS: lista e captura pelo ScreenCaptureKit.
screencapturekit = { version = "11", features = ["macos_14_0"] }
tokio = { version = "1", features = ["net", "sync", "rt", "macros"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rand = "0.9"
