<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Line Backoffice</title>
    <link rel="icon" href="https://useline.tech/site/favicon.png" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <div class="login">
      <form id="login-form" class="login-card">
        <div class="brand"><span class="logo">L</span> Line <span class="tag">backoffice</span></div>
        <p class="muted">Acesso restrito aos administradores do Line.</p>
        <label>Usuário<input name="username" autocomplete="username" required /></label>
        <label>Senha<input name="password" type="password" autocomplete="current-password" required /></label>
        <p id="login-error" class="error"></p>
        <button class="btn primary" type="submit">Entrar</button>
        <a id="google" class="btn" hidden>Entrar com Google</a>
      </form>
    </div>
    <script src="login.js"></script>
  </body>
</html>
