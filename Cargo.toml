[workspace]
resolver = "3"
members = ["apps/server", "apps/desktop/src-tauri", "crates/line-rtc"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
# Binário menor e mais rápido para o .exe final.
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

# Captura e conversão dos quadros da tela (Linux) rodam a cada quadro: sem otimização não passa de ~10 fps.
[profile.dev.package.line-desktop]
opt-level = 3
[profile.dev.package.x11rb]
opt-level = 3
[profile.dev.package.x11rb-protocol]
opt-level = 3
[profile.dev.package.fast_image_resize]
opt-level = 3
[profile.dev.package.yuvutils-rs]
opt-level = 3

# O scrypt é lento sem otimização; deixa os testes e o modo dev rápidos.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
